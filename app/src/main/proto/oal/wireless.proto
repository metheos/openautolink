syntax = "proto2";

package oal;
option java_package = "com.openautolink.app.proto";
option java_outer_classname = "Wireless";

enum AccessPointType {
    STATIC = 0;
    DYNAMIC = 1;
}

enum SecurityMode {
    UNKNOWN_SECURITY_MODE = 0;
    OPEN = 1;
    WEP_64 = 2;
    WEP_128 = 3;
    WPA_PERSONAL = 4;
    WPA2_PERSONAL = 8;
    WPA_WPA2_PERSONAL = 12;
    WPA_ENTERPRISE = 20;
    WPA2_ENTERPRISE = 24;
    WPA_WPA2_ENTERPRISE = 28;
}

message WifiStartRequest {
    required string ip_address = 1;
    required int32 port = 2;
    optional int32 status = 3;
}

message WifiInfoResponse {
    required string ssid = 1;
    required string key = 2;
    required string bssid = 3;
    required SecurityMode security_mode = 4;
    required AccessPointType access_point_type = 5;
}

/**
 * Head-unit endpoint for WPP-over-TCP.
 *
 * Field numbers recovered from the Android Auto 17.4 teardown by decoding the
 * protobuf-javalite RawMessageInfo string on the generated class (smali `xns`):
 *
 *     \u0001\u0002\u0000\u0001\u0001\u0002\u0002\u0000\u0000\u0000
 *     \u0001\u1008\u0000   -> field 1, STRING,  optional
 *     \u0002\u1004\u0001   -> field 2, INT32,   optional
 *
 * Cross-checked against the class's own field declarations
 * (`c:Ljava/lang/String;`, `d:I`) and its use at pdt.smali:551.
 */
message WifiProjectionProtocolInfo {
    optional string ip_address = 1;
    optional int32 port = 2;
}

/**
 * Version handshake. Must be sent BEFORE WifiStartRequest — gearhead warns
 * "Trying to proceed with WifiStartRequest before we received WifiVersionRequest"
 * and, more importantly, only learns our WPP-over-TCP endpoint from this message.
 *
 * Schema from smali `xnx` (fields 3/4/5 exist but are not needed by us):
 *     field 1 int32, field 2 int32, field 3 enum, field 4 repeated message,
 *     field 5 message, field 6 message
 * Field 6 is confirmed as WifiProjectionProtocolInfo at pdt.smali:446
 * (`iget-object v0, v6, Lxnx;->h:Lxns;`).
 *
 * Version must be >= 4.1: gearhead's `pev.d = jaj(4, 1)` gates the
 * WifiProjectionProtocolInfo handling with "Skip handling
 * WifiProjectionProtocolInfo as the protocol version is too low."
 */
message WifiVersionRequest {
    optional int32 version_major = 1;
    optional int32 version_minor = 2;
    optional WifiProjectionProtocolInfo wpp_info = 6;
}

message WifiVersionResponse {
    optional int32 version_major = 1;
    optional int32 version_minor = 2;
    optional int32 status = 3;
}
