name: Release APKs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Download native deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ABI in arm64-v8a x86_64; do
            gh release download native-deps -p "native-deps-${ABI}.tar.gz" -O "/tmp/native-deps-${ABI}.tar.gz"
            tar xzf "/tmp/native-deps-${ABI}.tar.gz" -C app/src/main/cpp/
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore
        run: |
          mkdir -p secrets
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > secrets/upload-key.jks

      # Derive the version from the release tag so both APKs are stamped with a
      # real, increasing version. Without this both modules fall back to their
      # defaults (versionCode 1) and every release APK looks identical to
      # Android, making installed builds impossible to tell apart.
      #
      # versionCode is the bare PATCH component (v0.1.372 -> 372) so CI shares
      # ONE sequence with scripts/linux/bundle-release.sh, which drives Play
      # releases from secrets/version.properties. Keeping the two in a single
      # sequence means a CI-built APK could go to Play without burning a
      # version number.
      #
      # This scheme only holds while the version stays on 0.1.x: bumping to
      # 0.2.0 would produce versionCode 0 and REGRESS below the current Play
      # value. That case fails the build on purpose -- pick the new numbering
      # deliberately and update this step plus secrets/version.properties
      # together, because a versionCode bump on Play is irreversible.
      - name: Derive version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NAME="${TAG#v}"
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: release tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if [ "$MAJOR" != "0" ] || [ "$MINOR" != "1" ]; then
            echo "ERROR: tag '$TAG' leaves the 0.1.x line." >&2
            echo "versionCode is the bare PATCH component, so '$NAME' would" >&2
            echo "produce versionCode $PATCH and may regress below the value" >&2
            echo "already published to Play. Choose the new numbering scheme" >&2
            echo "explicitly: update this step and secrets/version.properties." >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Version: name=$NAME code=$PATCH"

      - name: Build car app release APK
        env:
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PoalVersionCode=${{ steps.version.outputs.code }} \
            -PoalVersionName=${{ steps.version.outputs.name }}

      - name: Build companion release APK
        env:
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          ./gradlew :companion:assembleRelease --no-daemon \
            -PoalVersionCode=${{ steps.version.outputs.code }} \
            -PoalVersionName=${{ steps.version.outputs.name }}

      - name: Rename APKs
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/openautolink-car-${TAG}.apk"
          mv companion/build/outputs/apk/release/companion-release.apk \
             "companion/build/outputs/apk/release/openautolink-companion-${TAG}.apk"

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/openautolink-car-*.apk
            companion/build/outputs/apk/release/openautolink-companion-*.apk
